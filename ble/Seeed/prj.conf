# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_nRF54L15"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# Enable multiple advertising sets
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_MAX_CONN=1

# Logging and Console
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# GPIO for LED
CONFIG_GPIO=y

# Sensor support
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_I2C_NRFX=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Float formatting
CONFIG_CBPRINTF_FP_SUPPORT=y

# BLE buffers (minimal increase)
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247