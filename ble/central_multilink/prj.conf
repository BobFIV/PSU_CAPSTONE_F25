CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_PRIVACY=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_MAX_CONN=62
CONFIG_BT_SCAN_WITH_IDENTITY=y
# CONFIG_BT_EXT_ADV=y
# Increase the number of buffers to avoid deadlock when running out of buffers
CONFIG_BT_BUF_CMD_TX_COUNT=2

CONFIG_BT_GATT_CLIENT=y

# CONFIG_BT_SMP=y
# CONFIG_BT_MAX_PAIRED=62

# CONFIG_BT_EXT_ADV=y
# CONFIG_BT_CTLR_ADV_EXT=y

# LED and PWM configuration
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_GPIO=y
CONFIG_DK_LIBRARY=y

# Enable UART driver (existing - for console on UART0)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

# USB Device Support (NEW - for nRF5340 USB)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="nRF5340 Sensor Hub"
CONFIG_USB_DEVICE_MANUFACTURER="Your Company"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# USB CDC ACM (NEW)
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# Logging (NEW - useful for debugging both interfaces)
CONFIG_LOG=y
CONFIG_PRINTK=y