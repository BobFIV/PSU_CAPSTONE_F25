<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IoT Dashboard</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
    rel="stylesheet"
  >

  <style>
    body, .card, pre, table {
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    .metric-card {
      min-height: 140px;
      font-size: 1rem;
    }

    body.dark-mode .card {
      background-color: #1e1e2f;
      border: 1px solid #2a2a3d;
      color: #f5f5f5;
    }
    body.dark-mode .card-title {
      color: #f5f5f5;
    }
    body.dark-mode h2.fw-bold {
      color: #00e676;
    }
    body.dark-mode .text-success { color: #4caf50 !important; }
    body.dark-mode .text-danger { color: #ff5252 !important; }
    body.dark-mode .text-muted { color: #b0b0b0 !important; }

    body.dark-mode .table,
    body.dark-mode .table tbody,
    body.dark-mode .table tr,
    body.dark-mode .table td,
    body.dark-mode .table th {
      background-color: #1e1e2f !important;
      color: #e0e0e0 !important;
    }
    body.dark-mode .table thead th {
      background-color: #2a2a3d !important;
      color: #ffffff !important;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="mb-0">
          <i class="bi bi-bar-chart-fill text-primary"></i> IoT Device Dashboard
        </h1>
        <p class="text-muted small mb-0">
          Live data from oneM2M CSE: <code>cse-in/DummyData</code>
        </p>
      </div>
      <button id="toggleTheme" class="btn btn-outline-dark">
        🌙 Dark Mode
      </button>
    </div>

    <!-- Metrics -->
    <div class="row text-center mb-4 g-2">
      <!-- Temperature -->
      <div class="col-6 col-md-3">
        <div class="card shadow-sm metric-card h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center">
            <h6 class="text-muted">Temperature</h6>
            <h2 id="temperature" class="fw-bold text-muted">
              <i class="bi bi-thermometer"></i>
            </h2>
          </div>
        </div>
      </div>

      <!-- Humidity -->
      <div class="col-6 col-md-3">
        <div class="card shadow-sm metric-card h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center">
            <h6 class="text-muted">Humidity</h6>
            <h2 id="humidity" class="fw-bold text-muted">
              <i class="bi bi-droplet-half"></i>
            </h2>
          </div>
        </div>
      </div>

      <!-- Battery -->
      <div class="col-6 col-md-3">
        <div class="card shadow-sm metric-card h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center">
            <h6 class="text-muted">Battery</h6>
            <h2 id="battery" class="fw-bold text-muted">
              <i class="bi bi-battery-half"></i>
            </h2>
          </div>
        </div>
      </div>

      <!-- Signal -->
      <div class="col-6 col-md-3">
        <div class="card shadow-sm metric-card h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center">
            <h6 class="text-muted">Signal</h6>
            <h2 id="signal" class="fw-bold text-muted">
              <i class="bi bi-wifi"></i>
            </h2>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div class="col-12 col-md-3 mt-2">
        <div class="card shadow-sm metric-card h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center">
            <h6 class="text-muted">Status</h6>
            <h2 id="status" class="fw-bold text-muted">
              <i class="bi bi-question-circle"></i> Checking...
            </h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Events -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Recent Events</h5>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Parameter</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="events-body">
            <tr><td colspan="3" class="text-center text-muted">No data yet</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Theme Toggle -->
  <script>
    const toggleBtn = document.getElementById("toggleTheme");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      if (document.body.classList.contains("dark-mode")) {
        toggleBtn.textContent = "☀️ Light Mode";
        toggleBtn.classList.replace("btn-outline-dark", "btn-outline-light");
      } else {
        toggleBtn.textContent = "🌙 Dark Mode";
        toggleBtn.classList.replace("btn-outline-light", "btn-outline-dark");
      }
    });
  </script>

  <!-- Live Data Fetch -->
  <script>
    async function fetchSensorData() {
      const statusEl = document.getElementById("status");
      try {
        const response = await fetch("/get_sensor_data/");
        if (!response.ok) throw new Error("Network issue");
        const data = await response.json();

        // STATUS
        statusEl.innerHTML = `<i class="bi bi-check-circle"></i> Online`;
        statusEl.className = "fw-bold text-success";

        // Temperature
        const temp = data.temperature !== "N/A" ? parseFloat(data.temperature).toFixed(1) : "--";
        const tempEl = document.getElementById("temperature");
        tempEl.innerHTML = `<i class="bi bi-thermometer-half"></i> ${temp}°C`;
        tempEl.className = `fw-bold ${temp > 30 ? "text-danger" : "text-success"}`;

        // Humidity
        const hum = data.humidity !== "N/A" ? parseFloat(data.humidity).toFixed(1) : "--";
        const humEl = document.getElementById("humidity");
        humEl.innerHTML = `<i class="bi bi-droplet-half"></i> ${hum}%`;
        humEl.className = `fw-bold ${hum > 70 ? "text-warning" : "text-success"}`;

        // Battery
        const bat = data.battery !== "N/A" ? parseFloat(data.battery) : null;
        const batEl = document.getElementById("battery");
        if (bat !== null) {
          batEl.innerHTML = `<i class="bi bi-battery-full"></i> ${bat}%`;
          batEl.className = `fw-bold ${bat < 20 ? "text-danger" : "text-success"}`;
        } else {
          batEl.innerHTML = `<i class="bi bi-battery text-muted"></i> --`;
        }

        // Signal
        const sig = data.signal;
        const sigEl = document.getElementById("signal");
        if (sig === "N/A" || sig === null) {
          sigEl.innerHTML = `<i class="bi bi-wifi-off text-danger"></i> Offline`;
          sigEl.className = "fw-bold text-danger";
        } else {
          sigEl.innerHTML = `<i class="bi bi-wifi text-success"></i> ${sig}`;
          sigEl.className = "fw-bold text-success";
        }

        // Events Table
        const tbody = document.getElementById("events-body");
        tbody.innerHTML = "";
        const now = new Date().toLocaleTimeString();
        for (const [key, value] of Object.entries(data)) {
          tbody.innerHTML += `
            <tr>
              <td>${now}</td>
              <td>${key}</td>
              <td>${value}</td>
            </tr>`;
        }

      } catch (error) {
        statusEl.innerHTML = `<i class="bi bi-x-circle"></i> Offline`;
        statusEl.className = "fw-bold text-danger";
        console.error("Error fetching data:", error);
      }
    }

    fetchSensorData();
    setInterval(fetchSensorData, 5000);
  </script>
</body>
</html>
