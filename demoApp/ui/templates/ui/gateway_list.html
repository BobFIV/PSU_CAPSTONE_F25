<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gateways</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f4f9;
      color: #333;
      text-align: center;
    }
    h1 { color: #1565C0; margin-bottom: 20px; }
    .gateway-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
      margin: 20px auto;
      width: 60%;
    }
    .gateway-name { font-size: 1.4rem; font-weight: 600; }
    .gateway-path { color: #666; font-size: 0.9rem; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Registered Gateways</h1>
  {% if gateways %}
    {% for g in gateways %}
      <div class="gateway-card">
        <div class="gateway-name">{{ g.name }}</div>
        <div class="gateway-path">{{ g.path }}</div>
      </div>
    {% endfor %}
  {% else %}
    <p>No gateways found.</p>
  {% endif %}
</body>
</html>
